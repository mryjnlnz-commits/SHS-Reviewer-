
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHS Reviewer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px #ddd;
    }

    h1 {
      color: #6c4ccf;
    }

    p {
      color: #666;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      background: #8064e8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      background: #5e43bb;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📚 SHS Reviewer</h1>

    <p>Learn today. Be ready for exams!</p>

    <h3>Choose your subject</h3>

    <button onclick="alert('English coming soon!')">
      English
    </button>

    <button onclick="alert('Mathematics coming soon!')">
      Mathematics
    </button>

    <button onclick="alert('Science coming soon!')">
      Science
    </button>

    <button onclick="alert('Filipino coming soon!')">
      Filipino
    </button>
  </div>

</body>
</html>
